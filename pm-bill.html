<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="referrer" content="no-referrer"><meta name="robots" content="noindex,nofollow"><title>Repair bill &amp; approval | Dryer Dudes</title><link rel="stylesheet" href="styles-v2.css"><link rel="stylesheet" href="assets/pm-guest.css"><style>.bill-page{max-width:760px}.bill-lines{width:100%;border-collapse:collapse;margin:24px 0}.bill-lines th,.bill-lines td{padding:12px 0;border-bottom:1px solid var(--stroke);font-size:1rem;text-align:left}.bill-lines td:last-child{text-align:right;white-space:nowrap}.bill-lines th{font-weight:500}.bill-lines .total th,.bill-lines .total td{font-weight:800}.bill-actions{display:grid;gap:12px}.bill-secondary{background:transparent;color:var(--teal)!important;border:1px solid var(--teal)}.bill-summary{white-space:pre-wrap;overflow-wrap:anywhere}.bill-status{padding:16px;background:#183237;border-radius:10px;line-height:1.6}</style><script defer src="assets/pm-bill.js"></script></head><body>
<main class="guest-page bill-page"><header class="guest-header"><a class="guest-brand" href="index.html"><img src="assets/logo.png" alt=""><span>Dryer Dudes</span></a></header><section class="guest-surface"><h1 id="bill-title">Your repair bill</h1><p id="bill-loading" role="status">Loading your secure bill…</p><p id="bill-error" class="error" role="alert" hidden></p><div id="bill-view" hidden><p id="bill-job"></p><p id="bill-address"></p><p id="bill-summary" class="bill-summary"></p><table class="bill-lines"><caption class="secondary-copy">Repair charges</caption><tbody id="bill-lines"></tbody></table><p id="bill-status" class="bill-status" role="status"></p><div id="bill-actions" class="bill-actions"><label class="check-row" id="approve-agreement" hidden><input type="checkbox" id="approval-checkbox"><span id="approval-label"></span></label><button id="approve-bill" class="guest-button" type="button" hidden>Approve repair total</button><button id="decline-bill" class="guest-button bill-secondary" type="button" hidden>Decline proposed repair</button><button id="confirm-decline" class="guest-button bill-secondary" type="button" hidden>Confirm decline</button><button id="pay-bill" class="guest-button" type="button" hidden>Pay securely with Stripe</button><button id="refresh-bill" class="guest-link-button" type="button">Refresh bill status</button></div><p class="secondary-copy">No portal login needed. Payment is handled securely by Stripe. Card details are not entered on this page.</p></div><p>Need help? <a href="mailto:info@dryerdudes.com">info@dryerdudes.com</a></p></section></main></body></html>
